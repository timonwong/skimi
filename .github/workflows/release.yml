name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on main
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag commit $tag_commit is not reachable from main." >&2
            exit 1
          fi

  verify:
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release candidate
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --skip=publish --release-notes /dev/null --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release candidate
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_assets=(
            "skimi_${version}_darwin_amd64.tar.gz"
            "skimi_${version}_darwin_arm64.tar.gz"
            "skimi_${version}_linux_amd64.tar.gz"
            "skimi_${version}_linux_arm64.tar.gz"
            "skimi_${version}_windows_amd64.zip"
            "skimi_${version}_windows_arm64.zip"
          )
          mapfile -t actual_assets < <(
            jq -r '.[] | select(.type == "Archive") | .name' dist/artifacts.json | sort
          )
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "Release assets do not match the expected OS/architecture matrix." >&2
            printf 'Expected: %s\n' "${expected_assets[*]}" >&2
            printf 'Actual:   %s\n' "${actual_assets[*]}" >&2
            exit 1
          fi

          checksum="dist/checksums.txt"
          if [[ ! -f "$checksum" ]] || [[ $(wc -l < "$checksum") -ne 6 ]]; then
            echo "Expected one checksum entry for each release archive." >&2
            exit 1
          fi

          linux_archive="$(
            jq -r '.[] | select(.type == "Archive" and .goos == "linux" and .goarch == "amd64") | .path' \
              dist/artifacts.json
          )"
          mkdir -p "$RUNNER_TEMP/skimi-release-smoke"
          tar -xzf "$linux_archive" -C "$RUNNER_TEMP/skimi-release-smoke" skimi
          expected="skimi version $version"
          actual="$("$RUNNER_TEMP/skimi-release-smoke/skimi" --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Version output $actual does not match $expected." >&2
            exit 1
          fi

  release:
    needs: release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check stable release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Homebrew tap
        if: steps.release.outputs.stable == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: timonwong/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          path: tap

      - name: Update Homebrew tap
        if: steps.release.outputs.stable == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tap
          ./scripts/update-skimi "$GITHUB_REF_NAME"

      - name: Commit Homebrew tap update
        if: steps.release.outputs.stable == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          repository: tap
          file_pattern: Formula/skimi.rb
          commit_message: skimi ${{ steps.release.outputs.version }}
          commit_user_name: goreleaserbot
          commit_user_email: bot@goreleaser.com
          commit_author: goreleaserbot <bot@goreleaser.com>
